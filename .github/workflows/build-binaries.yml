name: Build and package Wallpaper

on:
  push:
    branches: [ 'wallhub', 'fix' ]
  workflow_dispatch:

jobs:
  build:
    name: Build (macOS, universal)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Show Swift version
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build (universal)
        run: |
          set -euo pipefail

          # Build separately for arm64 and x86_64 into distinct build paths to avoid conflicts
          echo "Building for arm64..."
          swift build -c release --arch arm64 --build-path .build-arm64

          echo "Building for x86_64..."
          swift build -c release --arch x86_64 --build-path .build-x86_64

          # Prepare artifacts directory
          mkdir -p artifacts

          ARM_BIN=.build-arm64/release/wallpaper
          X86_BIN=.build-x86_64/release/wallpaper

          if [ ! -f "$ARM_BIN" ]; then
            echo "arm64 binary not found at $ARM_BIN"
            ls -R .build-arm64 || true
            exit 1
          fi

          if [ ! -f "$X86_BIN" ]; then
            echo "x86_64 binary not found at $X86_BIN"
            ls -R .build-x86_64 || true
            exit 1
          fi

          cp "$ARM_BIN" artifacts/wallpaper-arm64
          cp "$X86_BIN" artifacts/wallpaper-x86_64

          # Create universal (fat) binary
          echo "Creating universal binary..."
          lipo -create artifacts/wallpaper-arm64 artifacts/wallpaper-x86_64 -output artifacts/wallpaper
          chmod +x artifacts/wallpaper

          echo "Universal binary info:"
          file artifacts/wallpaper || true
          lipo -info artifacts/wallpaper || true

      - name: Static check (manifest)
        run: |
          echo "Running swift package describe to validate Package.swift"
          swift package describe --type json > /dev/null

      - name: Run tests (if any)
        run: |
          if [ -d Tests ]; then
            echo "Tests directory found — running swift test"
            swift test -c release
          else
            echo "No Tests directory found — skipping tests"
          fi

      - name: Package artifact
        run: |
          TAR_NAME="wallpaper-macos-${GITHUB_SHA}.tar.gz"
          tar -czf "$TAR_NAME" -C artifacts wallpaper
          echo "Created $TAR_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-binary
          path: wallpaper-macos-*.tar.gz
